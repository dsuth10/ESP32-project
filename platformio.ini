[platformio]
default_envs = esp32-s3-portrait

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = post:tools/pio_board_guard.py
upload_protocol = custom

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_build.arduino.memory_type = dio_opi
board_build.partitions = partitions.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM

monitor_speed = 115200
upload_speed = 921600
; Supply the port explicitly. COM numbers do not identify physical boards.

; Portrait is the default build UI; uploads also require a registered board.

[env:esp32-s3-portrait]
build_flags =
    ${env.build_flags}
    -DUI_PORTRAIT

; Legacy landscape UI; guarded uploads require an explicit port and matching test device.
[env:esp32-s3-devkitc-1]
build_flags =
    ${env.build_flags}
    -DUI_LANDSCAPE
