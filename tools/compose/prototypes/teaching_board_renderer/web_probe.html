<!doctype html><meta charset="utf-8"><title>THROWAWAY local web renderer probe</title>
<style>
body{font:14px Segoe UI;margin:12px;background:#e6edf2;color:#17324d}button,input,select{padding:6px;margin:3px}canvas{background:white;width:100%;touch-action:none;border:1px solid #adb8c2}pre{white-space:pre-wrap;font-size:12px}#teacher{display:none}.row{display:flex;flex-wrap:wrap}input{flex:1}h3{margin:6px}
</style>
<h3 id="heading"></h3><div class="row"><button onclick="act('nav',{delta:-1})" class="nav">Previous</button><button onclick="act('nav',{delta:1})" class="nav">Next</button><select id="mode"><option>Ink</option><option>Erase</option></select></div>
<div id="teacher"><div class="row"><button onclick="act('freeze')">Freeze</button><button onclick="act('resume')">Resume</button><button onclick="act('undo')">Undo</button><button onclick="act('resize',{id:selected,scale:1.2})">Larger</button><button onclick="act('resize',{id:selected,scale:.8})">Smaller</button></div><div class="row"><input id="text" placeholder="Select text, edit and apply"><button onclick="act('text',{id:selected,text:document.querySelector('#text').value})">Apply text</button></div></div>
<canvas id="board" width="1600" height="900"></canvas><pre id="state">Loading local fixture bridge…</pre>
<script>
// THROWAWAY: no fetch, network URLs, external scripts/assets or persistent storage.
const audience=__AUDIENCE__,c=document.querySelector('#board'),ctx=c.getContext('2d');
let data=null,selected=null,drag=null,points=[],image=new Image();
document.querySelector('#heading').textContent='PROTOTYPE — local web '+(audience?'pupil':'teacher');
if(!audience){document.querySelector('#teacher').style.display='block';const o=document.createElement('option');o.textContent='Select / move';document.querySelector('#mode').prepend(o);document.querySelector('#mode').value=o.textContent;}
function line(points,colour,width){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.strokeStyle=colour;ctx.lineWidth=width;ctx.lineCap='round';ctx.stroke();}
function draw(){if(!data)return;ctx.clearRect(0,0,1600,900);ctx.fillStyle='white';ctx.fillRect(0,0,1600,900);for(const o of data.page.objects){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rotation*Math.PI/180);if(o.type==='text'){ctx.fillStyle=o.colour;ctx.font=`${o.font_size}px Segoe UI`;ctx.textBaseline='top';o.text.split('\n').forEach((s,i)=>ctx.fillText(s,0,i*o.font_size*1.2,o.width));}else if(o.type==='image'){if(image.complete)ctx.drawImage(image,0,0,o.width,o.height);}else if(o.type==='shape'){ctx.fillStyle=o.fill;ctx.strokeStyle=o.stroke;ctx.lineWidth=o.stroke_width;ctx.beginPath();if(o.shape==='ellipse')ctx.ellipse(o.width/2,o.height/2,o.width/2,o.height/2,0,0,Math.PI*2);else ctx.rect(0,0,o.width,o.height);ctx.fill();ctx.stroke();}else{const p=o.type==='ink'?o.points:[o.start,o.end];line(p,o.colour,o.stroke_width);if(o.type==='arrow'){const a=p[0],b=p[1],angle=Math.atan2(b[1]-a[1],b[0]-a[0]);for(const offset of [-.5,.5])line([b,[b[0]-30*Math.cos(angle+offset),b[1]-30*Math.sin(angle+offset)]],o.colour,o.stroke_width);}}if(o.id===selected&&!audience){ctx.strokeStyle='#287dcc';ctx.lineWidth=4;ctx.strokeRect(-6,-6,o.width+12,o.height+12);}ctx.restore();}if(points.length)line(points,'#d52b45',8);document.querySelector('#state').textContent=JSON.stringify(data.summary,null,2);document.querySelector('#heading').textContent='PROTOTYPE — local web '+(audience?'pupil':'teacher')+' — '+(data.frozen?'FROZEN / READ ONLY':'LIVE');document.querySelectorAll('.nav').forEach(b=>b.disabled=audience&&data.frozen);}
async function poll(){if(!window.pywebview)return;data=await window.pywebview.api.snapshot();if(image.src!==data.image){image.src=data.image;image.onload=draw;}draw();}
async function act(name,args={}){if(!window.pywebview)return;await window.pywebview.api.action(name,args);await poll();}
function point(e){const r=c.getBoundingClientRect();return [(e.clientX-r.left)*1600/r.width,(e.clientY-r.top)*900/r.height];}
function hit(p){return [...data.page.objects].reverse().find(o=>p[0]>=o.x&&p[0]<=o.x+o.width&&p[1]>=o.y&&p[1]<=o.y+o.height);}
c.onpointerdown=e=>{if(!data||(audience&&data.frozen))return;e.preventDefault();c.setPointerCapture(e.pointerId);const p=point(e),mode=document.querySelector('#mode').value,o=hit(p);if(mode==='Erase'){if(o&&o.type==='ink')act('erase',{id:o.id});return;}if(mode==='Select / move'&&!audience){selected=o?.id;drag=o?{id:o.id,start:p,x:o.x,y:o.y}:null;document.querySelector('#text').value=o?.text||'';draw();}else{points=[p];}};
c.onpointermove=e=>{if(!data||(audience&&data.frozen))return;if(points.length){const samples=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const sample of (samples.length?samples:[e]))points.push(point(sample));draw();}};
c.onpointerup=e=>{if(!data||(audience&&data.frozen)){points=[];drag=null;return;}const p=point(e);if(drag){act('move',{id:drag.id,x:drag.x+p[0]-drag.start[0],y:drag.y+p[1]-drag.start[1]});drag=null;}else if(points.length){points.push(p);act('ink',{points,source:e.pointerType==='pen'?'pen':e.pointerType==='touch'?'touch':'mouse'});points=[];}};
c.onpointercancel=()=>{points=[];drag=null;draw();};
window.addEventListener('pywebviewready',()=>{poll();setInterval(poll,250);});
</script>
